<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="765" viewBox="0 0 1040 765" role="img" aria-labelledby="title desc">
<title id="title">Bench wiring for the two supplied example sketches</title><desc id="desc">Uno input and built-in indicator wiring, and classic ESP32 low-voltage indicator, button and externally powered hobby servo connections.</desc>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#e1e9f1}.head{font-size:28px;font-weight:bold}.sub{font-size:18px;fill:#81e8cb}.note{font-size:14px;fill:#b5c6d5}.pin{font-family:monospace;font-size:18px}.box{fill:#152536;stroke:#40586a;stroke-width:2}.sig,.pwr,.gnd{fill:none;stroke-width:3}.sig{stroke:#82d9cd}.pwr{stroke:#eeae77}.gnd{stroke:#a6b3cc}</style>
<rect width="1040" height="765" rx="12" fill="#101820"/><text x="32" y="45" class="head">OpenExhibit bench connections</text><text x="32" y="78" class="note">USB powers the boards. Colours distinguish supply, signal and common ground. Confirm the printed labels on your board.</text>
<text x="32" y="121" class="sub">Classic Arduino Uno · ExhibitUno</text>
<rect class="box" x="32" y="138" width="235" height="238" rx="9"/><text x="50" y="168" class="pin">USB → computer</text>
<g class="pin" text-anchor="end"><text x="246" y="200">5 V</text><text x="246" y="230">A0</text><text x="246" y="260">GND</text><text x="246" y="292">D2</text><text x="246" y="322">D3</text><text x="246" y="352">D4</text></g>
<path class="pwr" d="M267 194h128"/><path class="sig" d="M267 224h128"/><path class="gnd" d="M267 254h128"/><rect class="box" x="395" y="176" width="257" height="94" rx="7"/>
<g class="note"><text x="408" y="198">Potentiometer · end terminal</text><text x="408" y="228">Potentiometer · centre wiper</text><text x="408" y="258">Potentiometer · opposite end</text></g>
<path class="sig" d="M267 286h132"/><circle cx="403" cy="286" r="4" fill="white"/><path class="sig" d="m407 283 26-12"/><circle cx="439" cy="286" r="4" fill="white"/><path class="gnd" d="M443 286h124"/><text x="582" y="290" class="note">GND · momentary push button</text>
<path class="sig" d="M267 316h128m-128 30h128"/><text x="408" y="321" class="note">Encoder A · rising-edge interrupt</text><text x="408" y="351" class="note">Encoder B · direction</text><text x="695" y="199" class="note">Encoder common → GND</text><text x="695" y="225" class="note">Use compatible open contacts</text><text x="695" y="249" class="note">or conditioned 5 V logic.</text><text x="34" y="400" class="note">The output lamp is the built-in LED. No external actuator or relay is connected to the Uno.</text>
<text x="32" y="453" class="sub">Classic ESP32 DevKit · ExhibitESP32</text><rect class="box" x="32" y="470" width="235" height="194" rx="9"/><text x="50" y="500" class="pin">3.3 V logic</text>
<g class="pin" text-anchor="end"><text x="246" y="538">GPIO25</text><text x="246" y="571">GPIO27</text><text x="246" y="605">GPIO26</text><text x="246" y="639">GND</text></g>
<path class="sig" d="M267 532h69"/><rect x="336" y="522" width="64" height="20" rx="3" fill="#384a50" stroke="#82d9cd"/><text x="349" y="537" class="note">1 kΩ</text><path class="sig" d="M400 532h33"/><text x="442" y="537" class="note">LED anode → LED cathode → GND</text>
<path class="sig" d="M267 565h164"/><text x="442" y="570" class="note">Momentary push button → GND</text><path class="sig" d="M267 599h164"/><text x="442" y="604" class="note">Servo signal</text><path class="gnd" d="M267 633h164"/><text x="442" y="638" class="note">Servo ground and external supply negative</text>
<rect class="box" x="697" y="471" width="300" height="119" rx="9"/><text x="712" y="501" class="note">External regulated servo supply</text><text x="712" y="531" class="note">Rated + → servo power lead</text><text x="712" y="558" class="note">Negative → shared signal ground</text>
<text x="32" y="697" class="note">Use a supply matched to the servo’s voltage and stall current. Keep the external positive supply isolated from the board’s 3.3 V rail.</text>
<text x="32" y="727" class="note">Set mechanical travel and an independent means to remove actuator power before arming. These examples have no mains-voltage wiring.</text></svg>
